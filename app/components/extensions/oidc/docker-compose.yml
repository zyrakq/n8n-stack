services:
  n8n:
    build:
      image: n8n
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-n8nio/n8n:latest}
        COPY hooks.js /opt/n8n-oidc/hooks.js
    environment:
      EXTERNAL_HOOK_FILES: ${EXTERNAL_HOOK_FILES:-/opt/n8n-oidc/hooks.js}
      EXTERNAL_FRONTEND_HOOKS_URLS: ${EXTERNAL_FRONTEND_HOOKS_URLS:-/assets/oidc-frontend-hook.js}
      N8N_TRUST_PROXY: ${N8N_TRUST_PROXY:-true}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_ADDITIONAL_NON_UI_ROUTES: $PN8N_ADDITIONAL_NON_UI_ROUTES:-auth}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://${N8N_HOST}/auth/oidc/callback}
      OIDC_USE_PKCE: ${OIDC_USE_PKCE:-true}
      OIDC_OWNER_EMAIL: ${OIDC_OWNER_EMAIL}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL}
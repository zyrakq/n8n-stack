[paths]
environments_path = "./environments"
extensions_dirs = [
    "extensions/database",
    "extensions"
]

[build]
extensions = [
    "pgrust",
    "postgresql",
    "qdrant",
]

[build.combos]
"pgrust+qdrant" = ["pgrust", "qdrant"]
"postgresql+qdrant" = ["postgresql", "qdrant"]

[build.environments]
available = ["forwarding", "letsencrypt", "step-ca"]

[build.environments.forwarding]
extensions = []

[build.environments.letsencrypt]
extensions = []

[build.environments.step-ca]
extensions = []
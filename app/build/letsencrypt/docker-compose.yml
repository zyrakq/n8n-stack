x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  n8n:
    container_name: n8n
    image: ${IMAGE:-n8nio/n8n:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:-}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL:-https://${VIRTUAL_HOST}/}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      EXTERNAL_HOOK_FILES: ${EXTERNAL_HOOK_FILES:-/home/node/.n8n/hooks.js}
      EXTERNAL_FRONTEND_HOOKS_URLS: ${EXTERNAL_FRONTEND_HOOKS_URLS:-/assets/oidc-frontend-hook.js}
      N8N_TRUST_PROXY: ${N8N_TRUST_PROXY:-true}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_ADDITIONAL_NON_UI_ROUTES: $PN8N_ADDITIONAL_NON_UI_ROUTES:-auth}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-${WEBHOOK_URL}auth/oidc/callback}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - n8n-network
      - letsencrypt-network
    build:
      image: n8n
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-n8nio/n8n:latest}
        COPY hooks.js /home/node/.n8n/hooks.js
volumes:
  n8n-data:
    name: n8n-data
networks:
  n8n-network:
    name: n8n-network
  letsencrypt-network:
    external: true

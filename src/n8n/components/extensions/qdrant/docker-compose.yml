x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}

services:
  n8n-qdrant:
    container_name: n8n-qdrant
    image: qdrant/qdrant
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - n8n-qdrant:/qdrant/storage
    networks:
      - n8n-network

volumes:
  n8n-qdrant:
    name: n8n-qdrant

networks:
  n8n-network:
    name: n8n-network
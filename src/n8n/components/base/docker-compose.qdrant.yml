services:
  n8n-qdrant:
    container_name: n8n-qdrant
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - n8n-qdrant:/qdrant/storage
    networks:
      - n8n-network

  n8n:
    networks:
      - n8n-network

volumes:
  n8n-qdrant:
    name: n8n-qdrant

networks:
  n8n-network:
    name: n8n-network